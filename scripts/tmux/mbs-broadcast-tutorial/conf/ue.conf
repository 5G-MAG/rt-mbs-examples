[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1

device_name = zmq
# See gnb.yaml's matching comment: the UE runs in its own network namespace (receive-netns.sh),
# connected to the gNB's root-namespace side by a veth pair (root=10.90.0.1, rx=10.90.0.3).
# tx_port binds *this* namespace's wildcard address (reachable via 10.90.0.3 from the root side);
# rx_port connects out to the gNB's tx_port across the veth. Confirmed live: the equivalent
# same-namespace/loopback config deadlocks (UE retransmits PRACH forever, gNB never detects a
# single preamble), even on an unmodified, previously-verified commit and even using the
# pre-built reference Docker images -- not a code regression, a topology requirement.
device_args = tx_port=tcp://*:2001,rx_port=tcp://10.90.0.1:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = none
mac_filename = @@LOG_DIR@@/ue_mac.pcap
mac_nr_filename = @@LOG_DIR@@/ue_mac_nr.pcap
nas_filename = @@LOG_DIR@@/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = @@LOG_DIR@@/ue-internal.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 00000000000000000000000000000000
k    = 00000000000000000000000000000000
imsi = 999700000000001
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[slicing]
enable = false
nssai-sst = 1
nssai-sd = 1

[nas]
apn = internet
apn_protocol = ipv4

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
