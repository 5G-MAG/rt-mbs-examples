logger:
  file:
    path: /var/log/open5gs/upf_mb-upf.log

global:

upf:
  pfcp:
    server:
      - address: upf-mb-upf.5g-mag.org
    client:
  gtpu:
    server:
      - address: upf-mb-upf.5g-mag.org
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
  mbs:
    udptunnel:
      # NOTE: unlike pfcp.server/gtpu.server above, this field is parsed with ogs_inet_pton()
      # (src/upf/context.c), which only accepts a literal numeric IP address, never a hostname --
      # must match the static ipv4_address given to this container in the compose file.
      address: 10.33.33.99
      port: 0 
